<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css">
  <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Vazirmatn"> -->
</head>
<body>
  <div id="maintodolist">
    <h2>لیست کارهای شما</h2>
    <div id="input">
      <input id="input-fild" type="text" placeholder="    کار جدید">
      <button id="enter-button">ایجاد کار</button>
    </div>
    <div id="tasks-list">
      <ul>
        <li class="task glassbox" id="task-id-test1">
          <input class="delete-task" id="del-id-test1" type="button" value="حذف">
          <input type="checkbox" class="task-check">
          <p class="task-text">کار اول</p>
        </li>
        <li class="task glassbox" id="task-id-test2">
          <input class="delete-task" id="del-id-test2" type="button" value="حذف">
          <input type="checkbox" class="task-check">   
          <p class="task-text">کار دوم</p>
        </li>
      </ul>
    </div>
  </div>


</div>

  <script src="script.js"></script>
</body>
</html>
